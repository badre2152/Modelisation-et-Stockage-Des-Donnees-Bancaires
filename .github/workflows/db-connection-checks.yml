name: Database connection checks

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  db-connection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install SQLAlchemy==2.0.49 python-dotenv==1.2.2
      - name: Compile Python sources
        run: python -m compileall -q database_pipeline_py tests
      - name: Test database URL construction
        run: python -m unittest discover -s tests -v
